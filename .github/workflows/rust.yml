name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose --locked
      - run: cargo test --verbose --locked

  e2e:
    name: End-to-end (PostgreSQL)
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ringseal
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: ringseal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ringseal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ringseal:testpw@127.0.0.1:5432/ringseal?sslmode=disable
      PSQL_URL: postgresql://ringseal:testpw@127.0.0.1:5432/ringseal
      MASTER_SECRET: e2e-master-secret-0123456789abcdef0123456789abcdef
      ADMIN_SECRET: e2e-admin-secret-0123456789
      HOST: 127.0.0.1
      PORT: "8080"
      INTERNAL_PORT: "9090"
      CODE_EXPIRY_SECONDS: "60"
      MAX_ATTEMPTS: "3"
      RUST_LOG: ringseal=info
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Start server
        run: |
          ./target/debug/ringseal > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/api/v1/health && exit 0
            sleep 1
          done
          echo "server did not become healthy" && cat server.log && exit 1
      - name: Run end-to-end tests
        run: python3 tests/e2e.py
      - name: Server log
        if: failure()
        run: cat server.log
