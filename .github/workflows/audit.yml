name: Security audit

on:
  schedule:
    - cron: "23 4 * * 1"   # weekly: new advisories can appear without any code change
  workflow_dispatch:
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
