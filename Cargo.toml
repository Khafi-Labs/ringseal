[package]
name = "ringseal"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Multi-tenant caller-verification API for banks"
repository = "https://github.com/khafiLabs/ringseal"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "derive", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id", "timeout"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json"] }
dotenvy = "0.15"
thiserror = "2"
aes-gcm = "0.10"
hmac = "0.13"
url = "2"
subtle = "2"
